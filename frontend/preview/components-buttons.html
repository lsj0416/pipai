<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Buttons</title></head><body>
<div class="kicker">Buttons · primary / secondary / ghost / danger</div>
<style>
  .btn{font-family:var(--font-body);font-size:14px;font-weight:600;border-radius:10px;padding:10px 18px;border:1px solid transparent;cursor:pointer;letter-spacing:-0.01em;}
  .btn-primary{background:#003764;color:white;}
  .btn-primary:hover{background:#002C50;}
  .btn-secondary{background:white;color:#003764;border-color:#DDDDDD;}
  .btn-ghost{background:transparent;color:#404040;}
  .btn-danger{background:#E4032E;color:white;}
  .btn-sm{font-size:13px;padding:7px 13px;border-radius:8px;}
</style>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
  <button class="btn btn-primary">대화 시작하기 →</button>
  <button class="btn btn-secondary">이전 대화 보기</button>
  <button class="btn btn-ghost">취소</button>
  <button class="btn btn-danger">대화 삭제</button>
</div>
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px;">
  <button class="btn btn-primary btn-sm">저장</button>
  <button class="btn btn-secondary btn-sm">+ 항목 추가</button>
  <button class="btn btn-ghost btn-sm" style="opacity:0.5;" disabled>비활성</button>
</div>
</body></html>
