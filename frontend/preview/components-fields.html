<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Form fields</title></head><body>
<div class="kicker">Form fields</div>
<style>
  .field{display:flex;flex-direction:column;gap:6px;max-width:340px;margin-bottom:12px;}
  .field label{font-size:13px;font-weight:500;color:#404040;}
  .input{font-family:var(--font-body);font-size:14px;padding:10px 12px;border:1px solid #DDDDDD;border-radius:10px;background:white;color:#141414;outline:none;}
  .input:focus{border-color:#3F6E9A;box-shadow:0 0 0 3px rgba(0,55,100,0.20);}
  .input.err{border-color:#E4032E;box-shadow:0 0 0 3px rgba(228,3,46,0.15);}
  .help{font-size:12px;color:#757575;}
  .help.err{color:#E4032E;}
</style>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
  <div class="field">
    <label>회사명</label>
    <input class="input" value="(주)한국상점" />
  </div>
  <div class="field">
    <label>대표자 이메일</label>
    <input class="input" placeholder="example@company.kr" style="color:#999;" />
    <div class="help">알림이 발송될 주소입니다.</div>
  </div>
  <div class="field">
    <label>주민등록번호</label>
    <input class="input err" value="900101-1234567" />
    <div class="help err">보호 대상 정보예요. 입력하지 마세요.</div>
  </div>
  <div class="field">
    <label>업종</label>
    <select class="input"><option>온라인 쇼핑몰</option></select>
  </div>
</div>
</body></html>
