<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Composer</title></head><body>
<div class="kicker">Composer · sticky bottom</div>

    </div>
    <button style="background:#003764;color:white;border:none;width:32px;height:32px;border-radius:8px;font-size:16px;cursor:pointer;">↑</button>
