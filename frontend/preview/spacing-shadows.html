<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Shadows</title></head><body>
<div class="kicker">Elevation · cool blue-tinted shadows</div>
<div style="display:flex;gap:20px;padding:10px 0;">
  <div style="text-align:center;"><div style="width:90px;height:60px;background:white;border-radius:10px;box-shadow:0 1px 2px rgba(0,55,100,0.05);"></div><div style="font-family:var(--font-mono);font-size:10px;color:#757575;margin-top:8px;">xs</div></div>
  <div style="text-align:center;"><div style="width:90px;height:60px;background:white;border-radius:10px;box-shadow:0 1px 3px rgba(0,55,100,0.06),0 1px 2px rgba(0,55,100,0.04);"></div><div style="font-family:var(--font-mono);font-size:10px;color:#757575;margin-top:8px;">sm · cards rest</div></div>
  <div style="text-align:center;"><div style="width:90px;height:60px;background:white;border-radius:10px;box-shadow:0 4px 12px rgba(0,55,100,0.08),0 2px 4px rgba(0,55,100,0.04);"></div><div style="font-family:var(--font-mono);font-size:10px;color:#757575;margin-top:8px;">md · cards hover</div></div>
  <div style="text-align:center;"><div style="width:90px;height:60px;background:white;border-radius:10px;box-shadow:0 12px 28px rgba(0,55,100,0.10),0 4px 8px rgba(0,55,100,0.05);"></div><div style="font-family:var(--font-mono);font-size:10px;color:#757575;margin-top:8px;">lg · popovers</div></div>
  <div style="text-align:center;"><div style="width:90px;height:60px;background:white;border-radius:10px;box-shadow:0 24px 48px rgba(0,55,100,0.14);"></div><div style="font-family:var(--font-mono);font-size:10px;color:#757575;margin-top:8px;">xl · modals</div></div>
</div>
</body></html>
