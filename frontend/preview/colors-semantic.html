<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><title>Semantic colors</title></head><body>
<div class="kicker">Semantic state</div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
  <div>
    <div class="swatch dark" style="background:#1E8E3E;"><div class="label-name">Success</div><div class="hex">#1E8E3E</div></div>
    <div style="background:#E6F4EA;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:11px;color:#1E8E3E;font-family:var(--font-mono);">success-bg #E6F4EA</div>
  </div>
  <div>
    <div class="swatch dark" style="background:#B7791F;"><div class="label-name">Warning</div><div class="hex">#B7791F</div></div>
    <div style="background:#FEF3C7;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:11px;color:#B7791F;font-family:var(--font-mono);">warning-bg #FEF3C7</div>
  </div>
  <div>
    <div class="swatch dark" style="background:#E4032E;"><div class="label-name">Danger</div><div class="hex">#E4032E</div></div>
    <div style="background:#FDECEF;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:11px;color:#E4032E;font-family:var(--font-mono);">danger-bg #FDECEF</div>
  </div>
  <div>
    <div class="swatch dark" style="background:#3F6E9A;"><div class="label-name">Info</div><div class="hex">#3F6E9A</div></div>
    <div style="background:#F0F5FA;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:11px;color:#003764;font-family:var(--font-mono);">info-bg #F0F5FA</div>
  </div>
</div>
</body></html>
