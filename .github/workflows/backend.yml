name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    services:
      db:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: pipai
          POSTGRES_USER: pipai
          POSTGRES_PASSWORD: pipai
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Run tests
        run: |
          cd backend
          ./gradlew test
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_URL: jdbc:postgresql://localhost:5432/pipai
          DB_USERNAME: pipai
          DB_PASSWORD: pipai
          JWT_SECRET: test-secret-for-ci-at-least-32-characters-long
          LAW_API_KEY: dummy
          OPENAI_API_KEY: dummy

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker image
        id: build-image
        env:
          IMAGE_URI: ${{ secrets.ECR_REGISTRY }}/pipai-backend:${{ github.sha }}
        run: |
          docker build -t $IMAGE_URI ./backend
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs-task-definition.json
          container-name: pipai-backend
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: pipai-cluster
          service: pipai-backend
          wait-for-service-stability: true

      - name: Update Vercel BACKEND_URL with new ECS IP
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_GITHUB_REPO_ID: ${{ secrets.VERCEL_GITHUB_REPO_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN not set, skipping"
            exit 0
          fi

          sleep 10
          TASK_ARN=$(aws ecs list-tasks --cluster pipai-cluster --service-name pipai-backend --query 'taskArns[0]' --output text)
          ENI_ID=$(aws ecs describe-tasks --cluster pipai-cluster --tasks $TASK_ARN --query "tasks[0].attachments[0].details[?name=='networkInterfaceId'].value" --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --query 'NetworkInterfaces[0].Association.PublicIp' --output text)

          ENV_ID=$(curl -s "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            | python3 -c "import sys,json; envs=json.load(sys.stdin)['envs']; print(next((e['id'] for e in envs if e['key']=='BACKEND_URL'), ''))")

          if [ -n "$ENV_ID" ]; then
            curl -s -X PATCH "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$ENV_ID" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"value\": \"http://$PUBLIC_IP:8080\"}"
          fi

          curl -s -X POST "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\": \"pipai-frontend\", \"target\": \"production\", \"gitSource\": {\"type\": \"github\", \"repoId\": \"$VERCEL_GITHUB_REPO_ID\", \"ref\": \"main\"}}" || true
