version: '3.8'
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: pipai
      POSTGRES_USER: pipai
      POSTGRES_PASSWORD: pipai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
