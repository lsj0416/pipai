spring:
  application:
    name: PIPAi

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: simple

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600        # 1시간 (초)
  refresh-expiration: 604800  # 7일 (초)

law-api:
  key: ${LAW_API_KEY}
  base-url: https://www.law.go.kr/DRF

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: text-embedding-3-small
  chat-model: gpt-4o

admin:
  secret: ${ADMIN_SECRET:}

logging:
  level:
    com.pipai: INFO
    org.springframework.security: WARN
